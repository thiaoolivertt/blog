:root[data-theme="dark"]{--bg:#1a1917; --fg:#e9e6de; --muted:#9d988d; --rule:#35332e; --accent:#d98b6a; --note-bg:#25231f; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:1.18rem;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto}
a{color:inherit;text-decoration-color:var(--rule);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--measure);margin:0 auto}

#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:20;margin-top:env(safe-area-inset-top,0px)}

header.site{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding-block:2rem 0;font-family:var(--sans);font-size:.88rem}
header.site .name{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1.2;text-decoration:none}
header.site nav{display:flex;gap:1.4rem;align-items:center}
.theme-toggle{all:unset;cursor:pointer;position:relative;box-sizing:border-box;width:56px;height:28px;border-radius:14px;background:var(--track);border:1.5px solid var(--knob);flex:none}
.theme-toggle::after{content:"";position:absolute;top:3.5px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--knob);transition:transform .25s ease}
.theme-toggle[aria-checked="true"]::after{transform:translateX(27px)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.theme-toggle,.theme-toggle::after{transition:none}}
header.site nav a{text-decoration:none;color:var(--muted)}
header.site nav a[aria-current="page"],header.site nav a:hover{color:var(--fg)}

main{padding-block:2.6rem 5rem}

/* Página inicial */
.bio p{margin:0 0 1.4rem;font-size:1.25rem;line-height:1.75}
.home h2{font-weight:700;font-size:1.65rem;line-height:1.2;margin:2.6rem 0 1.2rem}
.essays{margin:0;padding-left:1.8rem}
.essays li{font-size:1.25rem;line-height:1.5;margin-bottom:1.2rem}
.essays a{text-decoration-color:currentColor}
.essays a:hover{color:var(--accent)}

/* Ensaio */
.kicker{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:700;font-size:clamp(2.3rem,6vw,3.3rem);line-height:1.1;letter-spacing:-.01em;margin:.6rem 0 0;text-wrap:balance}
.subtitle{font-style:italic;font-size:1.35rem;color:var(--muted);margin:.9rem 0 0;line-height:1.4;text-wrap:balance}
.meta{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-top:1.6rem}
.essay-head{padding-bottom:2.4rem;border-bottom:1px solid var(--rule);margin-bottom:2.4rem}

.toc{font-family:var(--sans);font-size:.9rem;margin:0 0 2.6rem;padding:0;list-style:none;display:grid;gap:.35rem}
.toc-title{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
.toc a{text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--fg)}

article p{margin:0 0 1.3rem;hyphens:auto}
article h2{font-weight:400;font-size:1.6rem;line-height:1.25;margin:3.2rem 0 1.1rem;text-wrap:balance;scroll-margin-top:2rem}
article h3{font-weight:400;font-size:1.2rem;margin:2.2rem 0 .8rem}
article blockquote{margin:1.8rem 0;padding-left:1.3rem;border-left:2px solid var(--rule);font-style:italic;color:var(--muted)}
article ul,article ol{padding-left:1.3rem;margin:0 0 1.3rem}
article li{margin-bottom:.55rem}
article li::marker{color:var(--muted)}
.table-wrap{overflow-x:auto;margin:1.8rem 0}
article table{border-collapse:collapse;width:100%;min-width:32rem;font-size:1rem;line-height:1.5}
article th,article td{text-align:left;vertical-align:top;padding:.65rem 1rem .65rem 0;border-bottom:1px solid var(--rule)}
article th{font-weight:400;font-style:italic;border-bottom-color:var(--fg)}
article strong,.pop strong{font-weight:400}

sup.fn{font-family:var(--sans);font-size:.68rem;line-height:0;margin-left:1px}
sup.fn button{all:unset;cursor:pointer;color:var(--accent);padding:0 2px}
.pop{position:absolute;z-index:30;max-width:min(24rem,calc(100vw - 32px));background:var(--note-bg);border:1px solid var(--rule);
  padding:.8rem 1rem;font-size:.95rem;line-height:1.5;border-radius:4px;box-shadow:0 6px 24px rgb(0 0 0 / .08)}
.notes{margin-top:4rem;padding-top:1.6rem;border-top:1px solid var(--rule);font-size:.95rem;color:var(--muted)}
.notes h2{font-family:var(--sans);font-weight:400;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 1rem}
.notes ol{padding-left:1.4rem;display:grid;gap:.6rem;margin:0}
.to-top{margin:3rem 0 0;font-size:1.25rem;text-align:center}
.to-top a{text-decoration-color:currentColor}
.to-top a:hover{color:var(--accent)}
.notes a.back{text-decoration:none;color:var(--accent);margin-left:.3rem;font-family:var(--sans);font-size:.8rem}

.endmark{text-align:center;color:var(--muted);margin:3rem 0 0;letter-spacing:.6em}

/* Índice de ensaios */
.intro{font-size:1.3rem;line-height:1.55;margin:0 0 3.5rem;text-wrap:pretty}
.intro em{color:var(--muted)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--rule)}
.list a{display:grid;grid-template-columns:1fr auto;gap:.3rem 1.5rem;padding:1.4rem 0;text-decoration:none}
.list .t{font-size:1.4rem;line-height:1.3;font-weight:700}
.list a:hover .t{color:var(--accent)}
.list .d{font-family:var(--sans);font-size:.82rem;color:var(--muted);white-space:nowrap;padding-top:.45rem;font-variant-numeric:tabular-nums}
.list .s{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:1.05rem}
.section-label{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .8rem}

footer.site{font-family:var(--sans);font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule);
  padding-block:1.6rem 2.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

@media (max-width:520px){
  body{font-size:1.08rem}
  main{padding-block:3rem 4rem}
  .list a{grid-template-columns:1fr}
  .list .d{padding-top:0}
}
@media (prefers-reduced-motion:no-preference){ #app{animation:fade .35s ease both} @keyframes fade{from{opacity:.4}to{opacity:1}} }

/* Desktop: três colunas no desktop (sumário fixo · texto · notas na margem) */
.side-left,.side-right{display:none}
.essays li{margin-bottom:1.6rem}
.essays .item-sub{display:block;font-style:italic;font-size:1.05rem;line-height:1.45;margin-top:.25rem}
.essays .item-date{display:block;font-size:.95rem;margin-top:.2rem;font-variant-numeric:tabular-nums}
.sidenote{position:absolute;left:0;right:0;font-size:.9rem;line-height:1.5;padding:.2rem .4rem;margin:-.2rem -.4rem;border-radius:3px;transition:background .3s}
.sidenote .sn-n{color:var(--accent);font-size:.72rem;vertical-align:super;margin-right:.15rem}
.sidenote.hl{background:var(--note-bg)}
.side-toc{position:sticky;top:2rem}
.side-toc .toc-title{padding-left:calc(.8rem + 2px)}
.side-toc .toc{font-size:.95rem;gap:.55rem;margin:0}
.side-toc li{padding-left:.8rem;border-left:2px solid transparent;line-height:1.35}
.side-toc li.on{border-left-color:var(--fg)}
.essay-end{margin-top:3.5rem;display:grid;gap:1.3rem;justify-items:center;text-align:center}
.essay-end .to-top{margin:0}
.copy-link{all:unset;cursor:pointer;font-size:1.02rem;border:1px solid var(--fg);border-radius:999px;padding:.45rem 1.15rem;transition:background .2s,color .2s}
.copy-link:hover{background:var(--fg);color:var(--bg)}
.copy-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.next{margin:0;font-size:1.1rem}
.next a{text-decoration-color:currentColor}
@media (min-width:1280px){
  .essay-grid{display:grid;grid-template-columns:minmax(0,1fr) var(--measure) minmax(0,1fr);column-gap:3.5rem;
    width:min(1320px,calc(100vw - 64px));margin-left:calc(var(--measure) / 2 - min(660px, 50vw - 32px))}
  .side-left{display:block}
  .side-left{justify-self:end;width:100%;max-width:15rem;padding-top:.4rem}
  .side-right{position:relative;max-width:17rem}
  .toc-inline{display:none}
}
</style>

<body>

<div id="progress" aria-hidden="true"></div>
<div class="wrap">
  <header class="site">
    <a class="name" href="#inicio">Thiago Oliveira</a>
    <nav aria-label="Principal">
      <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Modo escuro" title="Alternar modo claro e escuro"></button>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="site">
    <span>© 2026 Thiago Oliveira</span>
    <span>Escrito devagar, publicado quando fica pronto.</span>
  </footer>
</div>

<script>
const ESSAYS = [
  {
    slug: "el-nino-planeta-mais-quente",
    title: "El Niño num planeta mais quente",
    subtitle: "Como um fenômeno antigo do Pacífico ganhou outra escala no Brasil",
    date: "Novembro de 2026",
    readMin: 11,
    body: `
<p>Quase todo brasileiro já ouviu falar do El Niño, geralmente no noticiário, quando chove demais no Sul ou falta água no Norte. Ele costuma ser tratado como um vilão sazonal, que aparece a cada poucos anos, bagunça o tempo e vai embora. Essa descrição não está errada, mas ficou incompleta. O El Niño de hoje atua sobre um planeta mais quente do que aquele em que ele foi estudado pela primeira vez, e isso muda o tamanho dos seus efeitos.</p>
<p>Neste ensaio quero explicar, de forma simples, o que é o fenômeno, como ele chega ao Brasil e por que a combinação entre El Niño e mudança climática merece mais atenção do que cada um separadamente.</p>

<h2 id="o-que-e">1. O que é o El Niño</h2>
<p>O El Niño é o aquecimento anormal das águas superficiais na faixa central e leste do Oceano Pacífico, perto da linha do Equador. O nome vem de pescadores do Peru, que notavam a água mais quente perto do Natal e a associavam ao Menino Jesus.<sup class="fn" data-n="1"></sup></p>
<p>Em condições normais, os ventos alísios sopram de leste para oeste no Pacífico e empurram a água quente na direção da Indonésia e da Austrália. Quando esses ventos enfraquecem, a água quente se espalha para o leste, em direção à América do Sul. Esse deslocamento muda onde o oceano aquece o ar, onde se formam as nuvens e, por consequência, o caminho das chuvas em boa parte do planeta.</p>
<p>O fenômeno tem uma fase oposta, a La Niña, quando o Pacífico central fica mais frio do que o normal. Juntas, as duas fases formam o que os climatologistas chamam de ENOS, sigla de El Niño–Oscilação Sul. Um episódio de El Niño costuma durar de nove meses a um ano e meio, e se repete de forma irregular a cada dois a sete anos.</p>

<h2 id="brasil">2. Como ele chega ao Brasil</h2>
<p>O Brasil fica longe do Pacífico, mas sente o El Niño com clareza, porque o fenômeno altera a circulação da atmosfera sobre a América do Sul. O padrão geral é conhecido há décadas:</p>
<div class="table-wrap"><table>
  <thead><tr><th>Região</th><th>Efeito típico</th><th>Exemplos</th></tr></thead>
  <tbody>
    <tr><td>Sul</td><td>Mais chuva, sobretudo no inverno e na primavera, e mais risco de cheias</td><td>Enchentes de 1983 em Santa Catarina; cheias de 2023 e 2024 no Rio Grande do Sul</td></tr>
    <tr><td>Norte</td><td>Menos chuva, rios mais baixos e mais risco de incêndios florestais</td><td>Secas na Amazônia em 1997–1998, 2015–2016 e 2023</td></tr>
    <tr><td>Nordeste</td><td>Seca, principalmente no norte da região e no semiárido</td><td>Perdas na agricultura de sequeiro e açudes mais vazios</td></tr>
    <tr><td>Sudeste e Centro-Oeste</td><td>Temperaturas mais altas; efeito sobre a chuva menos definido</td><td>Ondas de calor no fim de 2023</td></tr>
  </tbody>
</table></div>
<p>Esse padrão é uma tendência, e não uma regra. Cada El Niño tem intensidade, duração e forma diferentes, e outros fatores, como a temperatura do Atlântico, podem reforçar ou enfraquecer seus efeitos.<sup class="fn" data-n="2"></sup></p>
<p>Na prática, o El Niño divide o país. O Sul fica com água demais, e o Norte e o Nordeste, com água de menos. Para quem trabalha com recursos hídricos, isso significa planejar ao mesmo tempo para cheia e para seca, em regiões diferentes e no mesmo ano.</p>

<h2 id="2023-2024">3. 2023 e 2024: um El Niño num planeta mais quente</h2>
<p>O episódio que começou em meados de 2023 mostrou bem essa combinação. Ele foi um dos El Niños mais fortes já registrados, mas chegou num momento em que a temperatura média global já estava muito acima da de décadas anteriores. Somados, os dois efeitos levaram 2023, e depois 2024, a recordes de temperatura no planeta.</p>
<p>No Brasil, os sinais apareceram nas duas pontas. Na Amazônia, a seca de 2023 baixou os rios a níveis raramente vistos, isolou comunidades que dependem do transporte fluvial e causou a morte de botos no Lago Tefé, onde a água chegou a temperaturas extremas. No Rio Grande do Sul, uma sequência de chuvas intensas começou em setembro de 2023, no Vale do Taquari, e culminou na enchente de maio de 2024, a maior da história do estado.</p>
<p>Estudos de atribuição feitos logo depois desses eventos chegaram a conclusões parecidas. O El Niño contribuiu, mas o aquecimento global tornou os extremos mais prováveis e mais intensos. No caso da seca amazônica de 2023, a análise da rede World Weather Attribution apontou a mudança climática, e não o El Niño, como o principal fator.<sup class="fn" data-n="3"></sup></p>
<blockquote>O El Niño ainda dá o ritmo. Mas o volume da música aumentou.</blockquote>

<h2 id="aquecimento">4. O que muda com o aquecimento global</h2>
<p>Há duas perguntas diferentes aqui, e vale separá-las.</p>
<p>A primeira é se o aquecimento global muda o próprio El Niño, tornando-o mais frequente ou mais forte. Essa resposta ainda não está fechada. Alguns estudos indicam que episódios extremos podem ficar mais comuns ao longo deste século, mas os modelos climáticos ainda divergem bastante.<sup class="fn" data-n="4"></sup></p>
<p>A segunda é se os efeitos de um mesmo El Niño ficam piores num planeta mais quente. Aqui a resposta é mais clara, e é sim. Uma atmosfera mais quente carrega mais umidade, e as chuvas extremas no Sul tendem a ser mais volumosas. Com temperaturas mais altas, a evaporação aumenta, e as secas no Norte e no Nordeste secam o solo e os rios mais depressa. Um El Niño moderado hoje pode produzir impactos que antes só apareciam em episódios fortes.</p>
<p>Isso tem uma consequência direta para o planejamento. Os anos de El Niño do passado, como 1983 ou 1998, continuam úteis para entender o padrão, mas subestimam o que um evento parecido pode causar agora.</p>

<h2 id="avisa-antes">5. Um fenômeno que avisa antes</h2>
<p>O El Niño tem uma vantagem que outros extremos não têm: ele é previsível com meses de antecedência. Os centros de meteorologia acompanham a temperatura do Pacífico continuamente e costumam indicar a formação de um episódio com três a seis meses de folga. Poucos riscos climáticos dão tanto tempo para se preparar.</p>
<p>Esse tempo pode ser usado de várias formas:</p>
<ul>
  <li><strong>Operação de reservatórios.</strong> Abrir espaço para receber cheias no Sul e guardar água no Norte e no Nordeste antes do período seco.</li>
  <li><strong>Defesa civil.</strong> Revisar planos de contingência, mapas de risco e rotas de evacuação nas cidades com histórico de enchente.</li>
  <li><strong>Agricultura.</strong> Ajustar o calendário de plantio, a escolha das culturas e o seguro rural de acordo com a previsão para cada região.</li>
  <li><strong>Energia e abastecimento.</strong> Planejar o uso de outras fontes quando os reservatórios das hidrelétricas do Norte baixarem, e reforçar alternativas de abastecimento em cidades que dependem de rios que podem secar.</li>
  <li><strong>Transporte na Amazônia.</strong> Antecipar o envio de combustível, alimentos e remédios para comunidades que ficam isoladas quando os rios baixam.</li>
</ul>
<p>Nenhuma dessas medidas é nova. O que costuma faltar é transformar a previsão em decisão a tempo.<sup class="fn" data-n="5"></sup> Em 2023, a formação do El Niño foi anunciada meses antes das primeiras cheias no Sul e da seca na Amazônia.</p>
<p>O El Niño vai continuar voltando, como sempre voltou. A diferença é que agora ele encontra um país mais quente, mais urbanizado e mais exposto. Sabendo disso com antecedência, a pior escolha possível é ser pego de surpresa.</p>
`,
    notes: [
      "El Niño significa “o menino” em espanhol. Os primeiros registros do aquecimento na costa do Peru são do século XIX, mas a ligação do fenômeno com o clima do planeta inteiro só ficou clara na segunda metade do século XX.",
      "O Atlântico tropical tem papel importante, especialmente no Nordeste e na Amazônia. Em 2023, o Atlântico Norte também estava excepcionalmente quente, o que ajudou a intensificar a seca no norte do país.",
      "World Weather Attribution, análise publicada em janeiro de 2024 sobre a seca na Amazônia em 2023. Para a enchente do Rio Grande do Sul em 2024, a mesma rede concluiu que a mudança climática tornou o evento mais provável e mais intenso, com o El Niño como fator adicional.",
      "Um dos trabalhos mais citados é o de Cai e colegas, publicado na Nature Climate Change em 2014, que projetou uma frequência maior de El Niños extremos com o aquecimento. O tema segue em debate na literatura científica.",
      "No Brasil, o INMET e o CPTEC/INPE divulgam prognósticos climáticos para os meses seguintes, e a NOAA, nos Estados Unidos, publica todo mês um boletim de acompanhamento do ENOS."
    ]
  }
];

const BIO = `
  <p>Ensaios longos sobre o que eu penso :)</p>
  <p>Este é meu espaço pessoal para escrever com calma. Os textos aqui representam apenas a minha opinião, e alguns provavelmente vão envelhecer mal.</p>`;

const ABOUT = `
<div class="essay-head">
  <div class="kicker">Sobre</div>
  <h1>Olá, eu sou o Thiago.</h1>
</div>
<article>
  <p>Este é meu espaço pessoal para ensaios longos. Escrevo para organizar o que penso sobre trabalho, tecnologia e os problemas que me interessam.</p>
  <p>Os textos aqui representam apenas a minha opinião, e alguns deles provavelmente vão envelhecer mal.</p>
  <p>Se quiser conversar sobre algo que escrevi, me procure. Respondo com calma, mas respondo.</p>
</article>`;

const root = document.documentElement;
const toggle = document.getElementById("theme-toggle");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try { const saved = localStorage.getItem("tema"); if (saved === "dark" || saved === "light") root.dataset.theme = saved; } catch (_) {}
const syncToggle = () => toggle.setAttribute("aria-checked", String(isDark()));
syncToggle();
toggle.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("tema", next); } catch (_) {}
  syncToggle();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncToggle);

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderHome(){
  const items = ESSAYS.filter(e => !e.draft).map(e => `<li><a href="#${e.slug}">${esc(e.title)}</a><span class="item-sub">${esc(e.subtitle)}</span><span class="item-date">${e.date}${e.readMin ? ` · ${e.readMin} min de leitura` : ""}</span></li>`).join("");
  app.innerHTML = `
    <div class="home">
      <div class="bio">${BIO}</div>
      <h2>Ensaios</h2>
      <ul class="essays">${items}</ul>
    </div>`;
}

function renderEssay(e){
  const tmp = document.createElement("div");
  tmp.innerHTML = e.body;
  const heads = [...tmp.querySelectorAll("h2[id]")];
  const tocItems = heads.map(h=>`<li data-sec="${h.id}"><a href="#${e.slug}" data-jump="${h.id}">${h.textContent}</a></li>`).join("");
  const toc = heads.length > 1 ? `<nav class="toc-inline" aria-label="Conteúdo"><p class="toc-title">Conteúdo</p><ol class="toc">${tocItems}</ol></nav>` : "";
  const sideToc = heads.length > 1 ? `<nav class="side-toc" aria-label="Conteúdo do ensaio"><p class="toc-title">Conteúdo</p><ol class="toc">${tocItems}</ol></nav>` : "";
  tmp.querySelectorAll("sup.fn").forEach(s => {
    const n = s.dataset.n;
    s.id = "ref-" + n;
    s.innerHTML = `<button type="button" aria-label="Nota ${n}" data-note="${n}">${n}</button>`;
  });
  const notes = e.notes.length ? `<section class="notes"><h2>Notas</h2><ol>${e.notes.map((n,i)=>`<li id="nota-${i+1}">${n}<a class="back" href="#${e.slug}" data-jump="ref-${i+1}" aria-label="Voltar ao texto">↩</a></li>`).join("")}</ol></section>` : "";
  const sideNotes = e.notes.map((n,i)=>`<aside class="sidenote" data-side="${i+1}"><span class="sn-n">${i+1}</span>${n}</aside>`).join("");
  const list = ESSAYS.filter(x => !x.draft);
  const next = list[list.indexOf(e) + 1];
  app.innerHTML = `
    <div class="essay-grid">
      <div class="side-left">${sideToc}</div>
      <div class="col">
        <div class="essay-head">
          <div class="kicker">Ensaio</div>
          <h1>${esc(e.title)}</h1>
          <p class="subtitle">${esc(e.subtitle)}</p>
          <div class="meta">${e.date}${e.readMin ? ` · ${e.readMin} min de leitura` : ""}</div>
        </div>
        ${toc}
        <article>${tmp.innerHTML}</article>
        ${notes}
        <div class="essay-end">
          ${next ? `<p class="next">Próximo ensaio: <a href="#${next.slug}">${esc(next.title)}</a></p>` : ""}
          <p class="to-top"><a href="#${e.slug}" data-top>Voltar ao topo</a></p>
        </div>
      </div>
      <div class="side-right"></div>
    </div>`;
  app.dataset.slug = e.slug;
  requestAnimationFrame(() => { layoutSide(); activeSection(); });
}

const wideMQ = matchMedia("(min-width: 1280px)");
function layoutSide(){
  const right = app.querySelector(".side-right");
  if (!right || !wideMQ.matches) return;
  const base = right.getBoundingClientRect().top;
  let floor = 0;
  right.querySelectorAll(".sidenote").forEach(n => {
    const ref = document.getElementById("ref-" + n.dataset.side);
    if (!ref) return;
    const top = Math.max(ref.getBoundingClientRect().top - base - 4, floor);
    n.style.top = top + "px";
    floor = top + n.offsetHeight + 18;
  });
}
function activeSection(){
  const items = app.querySelectorAll(".side-toc li[data-sec]");
  if (!items.length) return;
  let cur = null;
  app.querySelectorAll("article h2[id]").forEach(h => { if (h.getBoundingClientRect().top < innerHeight * 0.35) cur = h.id; });
  items.forEach(li => li.classList.toggle("on", li.dataset.sec === cur));
}
addEventListener("resize", layoutSide);
wideMQ.addEventListener("change", layoutSide);
document.fonts?.ready.then(layoutSide);
addEventListener("scroll", activeSection, {passive:true});

let pop = null;
function closePop(){ if(pop){ pop.remove(); pop = null; } }
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-top]")){ ev.preventDefault(); closePop(); window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  const jump = ev.target.closest("[data-jump]");
  if (jump){ ev.preventDefault(); closePop(); document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const copy = ev.target.closest("[data-copy]");
  if (copy){
    const done = t => { copy.textContent = t; setTimeout(() => { copy.textContent = "Copiar link do ensaio"; }, 2200); };
    try { navigator.clipboard.writeText(location.href).then(() => done("Link copiado"), () => done(location.href)); }
    catch (_) { done(location.href); }
    return;
  }
  const btn = ev.target.closest("[data-note]");
  if (btn){
    const open = pop && pop.dataset.for === btn.dataset.note;
    closePop();
    if (open) return;
    const e = ESSAYS.find(x => x.slug === app.dataset.slug);
    pop = document.createElement("div");
    pop.className = "pop"; pop.dataset.for = btn.dataset.note; pop.setAttribute("role","note");
    pop.innerHTML = `<strong>${btn.dataset.note}.</strong> ${e.notes[btn.dataset.note-1]}`;
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
    const left = Math.min(Math.max(16, r.left + window.scrollX - w/2), document.documentElement.clientWidth - w - 16);
    pop.style.left = left + "px";
    pop.style.top = (r.bottom + window.scrollY + 8) + "px";
    return;
  }
  if (pop && !ev.target.closest(".pop")) closePop();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePop(); });

function route(){
  closePop();
  const h = location.hash.slice(1) || "inicio";
  const e = ESSAYS.find(x => x.slug === h);
  if (e){ renderEssay(e); }
  else { renderHome(); delete app.dataset.slug; }
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", a.dataset.nav === (h==="sobre"?"sobre":"inicio")) || a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === (h==="sobre"?"sobre":"inicio")) a.setAttribute("aria-current","page"); });
  document.title = e ? `${e.title} · Thiago Oliveira` : "Thiago Oliveira";
  window.scrollTo(0,0);
  progress();
}
const bar = document.getElementById("progress");
function progress(){
  if (!app.dataset.slug){ bar.style.width = 0; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
}
addEventListener("scroll", progress, {passive:true});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
