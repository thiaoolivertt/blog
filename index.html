:root[data-theme="dark"]{--bg:#1a1917; --fg:#e9e6de; --muted:#9d988d; --rule:#35332e; --accent:#d98b6a; --note-bg:#25231f; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:1.18rem;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto}
a{color:inherit;text-decoration-color:var(--rule);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--measure);margin:0 auto}

#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:20;margin-top:env(safe-area-inset-top,0px)}

header.site{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding-block:2rem 0;font-family:var(--sans);font-size:.88rem}
header.site .name{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1.2;text-decoration:none}
header.site nav{display:flex;gap:1.4rem;align-items:center}
.theme-toggle{all:unset;cursor:pointer;position:relative;box-sizing:border-box;width:56px;height:28px;border-radius:14px;background:var(--track);border:1.5px solid var(--knob);flex:none}
.theme-toggle::after{content:"";position:absolute;top:3.5px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--knob);transition:transform .25s ease}
.theme-toggle[aria-checked="true"]::after{transform:translateX(27px)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.theme-toggle,.theme-toggle::after{transition:none}}
header.site nav a{text-decoration:none;color:var(--muted)}
header.site nav a[aria-current="page"],header.site nav a:hover{color:var(--fg)}

main{padding-block:2.6rem 5rem}

/* Página inicial */
.bio p{margin:0 0 1.4rem;font-size:1.25rem;line-height:1.75}
.home h2{font-weight:700;font-size:1.65rem;line-height:1.2;margin:2.6rem 0 1.2rem}
.essays{margin:0;padding-left:1.8rem}
.essays li{font-size:1.25rem;line-height:1.5;margin-bottom:1.2rem}
.essays a{text-decoration-color:currentColor}
.essays a:hover{color:var(--accent)}

/* Ensaio */
.kicker{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:700;font-size:clamp(2.3rem,6vw,3.3rem);line-height:1.1;letter-spacing:-.01em;margin:.6rem 0 0;text-wrap:balance}
.subtitle{font-style:italic;font-size:1.35rem;color:var(--muted);margin:.9rem 0 0;line-height:1.4;text-wrap:balance}
.meta{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-top:1.6rem}
.essay-head{padding-bottom:2.4rem;border-bottom:1px solid var(--rule);margin-bottom:2.4rem}

.toc{font-family:var(--sans);font-size:.9rem;margin:0 0 2.6rem;padding:0;list-style:none;display:grid;gap:.35rem}
.toc-title{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .7rem}
.toc a{text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--fg)}

article p{margin:0 0 1.3rem;hyphens:auto}
article h2{font-weight:400;font-size:1.6rem;line-height:1.25;margin:3.2rem 0 1.1rem;text-wrap:balance;scroll-margin-top:2rem}
article h3{font-weight:400;font-size:1.2rem;margin:2.2rem 0 .8rem}
article blockquote{margin:1.8rem 0;padding-left:1.3rem;border-left:2px solid var(--rule);font-style:italic;color:var(--muted)}
article ul,article ol{padding-left:1.3rem;margin:0 0 1.3rem}
article li{margin-bottom:.55rem}
article li::marker{color:var(--muted)}
article strong,.pop strong{font-weight:400}

sup.fn{font-family:var(--sans);font-size:.68rem;line-height:0;margin-left:1px}
sup.fn button{all:unset;cursor:pointer;color:var(--accent);padding:0 2px}
.pop{position:absolute;z-index:30;max-width:min(24rem,calc(100vw - 32px));background:var(--note-bg);border:1px solid var(--rule);
  padding:.8rem 1rem;font-size:.95rem;line-height:1.5;border-radius:4px;box-shadow:0 6px 24px rgb(0 0 0 / .08)}
.notes{margin-top:4rem;padding-top:1.6rem;border-top:1px solid var(--rule);font-size:.95rem;color:var(--muted)}
.notes h2{font-family:var(--sans);font-weight:400;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 1rem}
.notes ol{padding-left:1.4rem;display:grid;gap:.6rem;margin:0}
.to-top{margin:3rem 0 0;font-size:1.25rem;text-align:center}
.to-top a{text-decoration-color:currentColor}
.to-top a:hover{color:var(--accent)}
.notes a.back{text-decoration:none;color:var(--accent);margin-left:.3rem;font-family:var(--sans);font-size:.8rem}

.endmark{text-align:center;color:var(--muted);margin:3rem 0 0;letter-spacing:.6em}

/* Índice de ensaios */
.intro{font-size:1.3rem;line-height:1.55;margin:0 0 3.5rem;text-wrap:pretty}
.intro em{color:var(--muted)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--rule)}
.list a{display:grid;grid-template-columns:1fr auto;gap:.3rem 1.5rem;padding:1.4rem 0;text-decoration:none}
.list .t{font-size:1.4rem;line-height:1.3;font-weight:700}
.list a:hover .t{color:var(--accent)}
.list .d{font-family:var(--sans);font-size:.82rem;color:var(--muted);white-space:nowrap;padding-top:.45rem;font-variant-numeric:tabular-nums}
.list .s{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:1.05rem}
.section-label{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .8rem}

footer.site{font-family:var(--sans);font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule);
  padding-block:1.6rem 2.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

@media (max-width:520px){
  body{font-size:1.08rem}
  main{padding-block:3rem 4rem}
  .list a{grid-template-columns:1fr}
  .list .d{padding-top:0}
}
@media (prefers-reduced-motion:no-preference){ #app{animation:fade .35s ease both} @keyframes fade{from{opacity:.4}to{opacity:1}} }
</style>
</head>
<body>

<div id="progress" aria-hidden="true"></div>
<div class="wrap">
  <header class="site">
    <a class="name" href="#inicio">Thiago Oliveira</a>
    <nav aria-label="Principal">
      <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Modo escuro" title="Alternar modo claro e escuro"></button>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="site">
    <span>© 2026 Thiago Oliveira</span>
    <span>Escrito devagar, publicado quando fica pronto.</span>
  </footer>
</div>

<script>
const ESSAYS = [
  {
    slug: "clima-que-ja-mudou",
    title: "Projetar para um clima que já mudou",
    subtitle: "Por que o passado deixou de ser um bom guia, e o que fazer a partir disso",
    date: "Novembro de 2026",
    readMin: 12,
    body: `
<p>Durante mais de um século, boa parte da engenharia que nos protege da água foi construída sobre uma premissa simples: o futuro vai se parecer com o passado. Medimos chuvas e vazões por décadas, calculamos a cheia que acontece uma vez a cada cem anos e dimensionamos diques, bueiros, barragens e redes de drenagem para aguentá-la. A premissa funcionou bem. O problema é que ela deixou de ser verdadeira.</p>
<p>Este ensaio é uma tentativa de organizar o que penso sobre mudanças climáticas a partir desse ângulo, mais prático do que o debate costuma ser. Não pretendo convencer ninguém de que o clima está mudando. Os dados já fazem isso. Quero pensar no que muda nas nossas decisões quando aceitamos que ele já mudou.</p>

<h2 id="o-que-mudou">1. O que já mudou</h2>
<p>A temperatura média do planeta está cerca de 1,3 °C acima do nível pré-industrial, e 2024 foi o primeiro ano civil a passar de 1,5 °C, o limite que o Acordo de Paris tentava evitar.<sup class="fn" data-n="1"></sup> Um grau e pouco parece pouco. Não é, porque o efeito mais importante não está na média, e sim nos extremos.</p>
<p>Uma atmosfera mais quente segura mais vapor de água, algo como 7% a mais para cada grau de aquecimento. Mais vapor significa chuvas mais intensas quando chove, e secas mais severas quando não chove, porque o solo e a vegetação também perdem água mais rápido. O ciclo hidrológico não fica apenas mais quente. Fica mais violento.</p>
<p>O Brasil viu as duas pontas desse ciclo em poucos meses. Em maio de 2024, o Guaíba chegou a 5,35 metros em Porto Alegre, superando a marca histórica de 1941, e a enchente atingiu a maior parte dos municípios do Rio Grande do Sul. Poucos meses depois, o Rio Negro em Manaus registrou a menor cota já medida, quebrando o recorde do ano anterior. Uma cheia e uma seca, ambas sem precedente na série histórica, no mesmo país e no mesmo ano.</p>

<h2 id="estacionariedade">2. O fim da estacionariedade</h2>
<p>Na hidrologia existe uma palavra para a premissa de que o passado descreve o futuro: estacionariedade. Ela supõe que as estatísticas das chuvas e das vazões variam de um ano para o outro, mas em torno de uma média e de uma variabilidade que não mudam com o tempo. Em 2008, um grupo de hidrólogos publicou um artigo com um título direto: <em>a estacionariedade morreu</em>.<sup class="fn" data-n="2"></sup></p>
<p>As consequências são concretas. Quando um projeto diz que uma estrutura resiste à cheia de 100 anos de tempo de retorno, ele está dizendo que, em cada ano, há 1% de chance de essa cheia ser superada. Esse número vem da série histórica. Se o clima mudou, a cheia que antes tinha 1% de chance pode ter 3% ou 5%. A estrutura continua de pé, igual a como foi construída, mas o nível de proteção que ela oferece caiu sem que ninguém percebesse.<sup class="fn" data-n="3"></sup></p>
<blockquote>A obra não mudou. O que ela precisa enfrentar mudou.</blockquote>
<p>Isso vale para muito mais do que diques. Vale para o volume de um reservatório de abastecimento, para a capacidade de uma galeria pluvial, para a cota de uma ponte e para o mapa que diz onde é seguro construir uma casa.</p>

<h2 id="mitigar-adaptar">3. Mitigar e adaptar ao mesmo tempo</h2>
<p>O debate climático costuma girar em torno da mitigação: reduzir emissões para limitar o aquecimento. Ela continua sendo indispensável, porque cada décimo de grau evitado reduz os extremos que vamos enfrentar. Mas mesmo que as emissões parassem amanhã, parte do aquecimento já está contratada. Por isso a adaptação deixou de ser uma alternativa e passou a ser uma necessidade.</p>
<p>Durante muito tempo, falar em adaptação soava como desistir da mitigação. Acho essa leitura errada. As duas coisas respondem a perguntas diferentes:</p>
<ul>
  <li><strong>Mitigar</strong> responde a quanto o clima ainda vai mudar.</li>
  <li><strong>Adaptar</strong> responde a como vamos viver com o que já mudou e com o que não conseguirmos evitar.</li>
</ul>
<p>Um país pode fazer bem uma e mal a outra. O ideal é fazer as duas, e o Brasil tem razões especiais para isso: ao mesmo tempo que concentra boa parte das florestas tropicais do mundo, tem cidades grandes construídas em várzeas, encostas e áreas costeiras.</p>

<h2 id="o-que-fazer">4. O que dá para fazer</h2>
<p>Não existe uma solução única, mas existe um conjunto de mudanças razoavelmente claras na forma de planejar e projetar:</p>
<ol>
  <li><strong>Projetar com cenários, e não só com a série histórica.</strong> Usar projeções climáticas para testar como uma obra se comporta em futuros mais quentes, em vez de assumir um único futuro igual ao passado.</li>
  <li><strong>Preferir soluções que falham bem.</strong> Uma estrutura que, quando superada, transborda de forma controlada é melhor do que uma que rompe de uma vez. Folga de projeto e rotas de escape para a água valem mais do que parecem.</li>
  <li><strong>Dar espaço para a água.</strong> Parques alagáveis, várzeas preservadas e áreas de retenção absorvem cheias de um jeito que tubulações sozinhas não conseguem.</li>
  <li><strong>Revisar o que já existe.</strong> Boa parte da infraestrutura que vai nos proteger nas próximas décadas já foi construída. Reavaliar seu nível real de proteção é tão importante quanto projetar obras novas.</li>
  <li><strong>Medir mais e melhor.</strong> Estações de chuva e de nível de rio são baratas perto do custo de um desastre, e só servem se forem mantidas por décadas.</li>
  <li><strong>Alertar a tempo.</strong> Um bom sistema de alerta, com previsão e comunicação clara, salva vidas mesmo quando a obra não é suficiente.</li>
</ol>
<p>Nada disso é novo para quem trabalha na área. O que mudou é a urgência, e o fato de que essas medidas deixaram de ser um refinamento para virar o centro do problema.<sup class="fn" data-n="4"></sup></p>

<h2 id="otimismo">5. Por que ainda sou otimista</h2>
<p>É fácil terminar um texto sobre clima em tom de catástrofe. Prefiro não fazer isso, por dois motivos.</p>
<p>O primeiro é que a tendência das emissões começou a mudar. Energia solar e eólica ficaram baratas muito mais rápido do que quase todas as previsões indicavam, e a matriz elétrica brasileira já é uma das mais limpas do mundo. Ainda falta muito, mas a direção existe.</p>
<p>O segundo é que adaptação é, em grande parte, um problema de engenharia, planejamento e gestão. São problemas difíceis, mas conhecidos. Sabemos medir, modelar, projetar e construir. O que precisamos é aceitar que o ponto de partida mudou e agir de acordo, antes da próxima cheia, e não depois dela.<sup class="fn" data-n="5"></sup></p>
<p>O clima do passado era um bom guia. Agora precisamos aprender a projetar sem ele.</p>
`,
    notes: [
      "Segundo o serviço europeu Copernicus, a temperatura média global de 2024 ficou cerca de 1,6 °C acima da média de 1850–1900. Um único ano acima de 1,5 °C não significa que a meta de Paris foi oficialmente ultrapassada, porque ela se refere a médias de vinte anos, mas mostra o quanto estamos perto.",
      "Milly e colegas, “Stationarity Is Dead: Whither Water Management?”, publicado na revista Science em 2008. O artigo virou referência obrigatória na discussão sobre projeto hidrológico em clima não estacionário.",
      "Um detalhe pouco intuitivo: mesmo sem mudança climática, a chance de uma obra de 100 anos de tempo de retorno ser superada ao menos uma vez em 50 anos de vida útil é de cerca de 40%. Com o clima mudando, esse número sobe.",
      "Também há uma dimensão de justiça aqui. Quem mora nas áreas mais expostas, como margens de rios e encostas, costuma ser quem tem menos recursos para se recuperar depois de um desastre.",
      "A COP30, realizada em Belém em 2025, colocou a adaptação no centro da agenda pela primeira vez de forma tão explícita. Resta ver quanto disso vira orçamento e obra."
    ]
  }
];

const BIO = `
  <p>Ensaios longos sobre o que eu penso :)</p>
  <p>Este é meu espaço pessoal para escrever com calma. Os textos aqui representam apenas a minha opinião, e alguns provavelmente vão envelhecer mal. Quando isso acontecer, vou deixar uma nota no próprio texto em vez de apagá-lo.</p>`;

const ABOUT = `
<div class="essay-head">
  <div class="kicker">Sobre</div>
  <h1>Olá, eu sou o Thiago.</h1>
</div>
<article>
  <p>Este é meu espaço pessoal para ensaios longos. Escrevo para organizar o que penso sobre trabalho, tecnologia e os problemas que me interessam.</p>
  <p>Os textos aqui representam apenas a minha opinião, e alguns deles provavelmente vão envelhecer mal. Quando isso acontecer, vou deixar uma nota no próprio texto em vez de apagá-lo.</p>
  <p>Se quiser conversar sobre algo que escrevi, me procure. Respondo com calma, mas respondo.</p>
</article>`;

const root = document.documentElement;
const toggle = document.getElementById("theme-toggle");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try { const saved = localStorage.getItem("tema"); if (saved === "dark" || saved === "light") root.dataset.theme = saved; } catch (_) {}
const syncToggle = () => toggle.setAttribute("aria-checked", String(isDark()));
syncToggle();
toggle.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("tema", next); } catch (_) {}
  syncToggle();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncToggle);

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderHome(){
  const items = ESSAYS.filter(e => !e.draft).map(e => `<li><a href="#${e.slug}">${esc(e.title)}</a></li>`).join("");
  app.innerHTML = `
    <div class="home">
      <div class="bio">${BIO}</div>
      <h2>Ensaios</h2>
      <ul class="essays">${items}</ul>
    </div>`;
}

function renderEssay(e){
  const tmp = document.createElement("div");
  tmp.innerHTML = e.body;
  const heads = [...tmp.querySelectorAll("h2[id]")];
  const toc = heads.length > 1 ? `<p class="toc-title">Conteúdo</p><ol class="toc">${heads.map(h=>`<li><a href="#${e.slug}" data-jump="${h.id}">${h.textContent}</a></li>`).join("")}</ol>` : "";
  tmp.querySelectorAll("sup.fn").forEach(s => {
    const n = s.dataset.n;
    s.id = "ref-" + n;
    s.innerHTML = `<button type="button" aria-label="Nota ${n}" data-note="${n}">${n}</button>`;
  });
  const notes = e.notes.length ? `<section class="notes"><h2>Notas</h2><ol>${e.notes.map((n,i)=>`<li id="nota-${i+1}">${n}<a class="back" href="#${e.slug}" data-jump="ref-${i+1}" aria-label="Voltar ao texto">↩</a></li>`).join("")}</ol></section>` : "";
  app.innerHTML = `
    <div class="essay-head">
      <div class="kicker">Ensaio</div>
      <h1>${esc(e.title)}</h1>
      <p class="subtitle">${esc(e.subtitle)}</p>
      <div class="meta">${e.date}${e.readMin ? ` · ${e.readMin} min de leitura` : ""}</div>
    </div>
    ${toc}
    <article>${tmp.innerHTML}</article>
    ${notes}
    <p class="to-top"><a href="#${e.slug}" data-top>Voltar ao topo</a></p>`;
  app.dataset.slug = e.slug;
}

let pop = null;
function closePop(){ if(pop){ pop.remove(); pop = null; } }
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-top]")){ ev.preventDefault(); closePop(); window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  const jump = ev.target.closest("[data-jump]");
  if (jump){ ev.preventDefault(); closePop(); document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const btn = ev.target.closest("[data-note]");
  if (btn){
    const open = pop && pop.dataset.for === btn.dataset.note;
    closePop();
    if (open) return;
    const e = ESSAYS.find(x => x.slug === app.dataset.slug);
    pop = document.createElement("div");
    pop.className = "pop"; pop.dataset.for = btn.dataset.note; pop.setAttribute("role","note");
    pop.innerHTML = `<strong>${btn.dataset.note}.</strong> ${e.notes[btn.dataset.note-1]}`;
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
    const left = Math.min(Math.max(16, r.left + window.scrollX - w/2), document.documentElement.clientWidth - w - 16);
    pop.style.left = left + "px";
    pop.style.top = (r.bottom + window.scrollY + 8) + "px";
    return;
  }
  if (pop && !ev.target.closest(".pop")) closePop();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closePop(); });

function route(){
  closePop();
  const h = location.hash.slice(1) || "inicio";
  const e = ESSAYS.find(x => x.slug === h);
  if (e){ renderEssay(e); }
  else { renderHome(); delete app.dataset.slug; }
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", a.dataset.nav === (h==="sobre"?"sobre":"inicio")) || a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === (h==="sobre"?"sobre":"inicio")) a.setAttribute("aria-current","page"); });
  document.title = e ? `${e.title} · Thiago Oliveira` : "Thiago Oliveira";
  window.scrollTo(0,0);
  progress();
}
const bar = document.getElementById("progress");
function progress(){
  if (!app.dataset.slug){ bar.style.width = 0; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
}
addEventListener("scroll", progress, {passive:true});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
